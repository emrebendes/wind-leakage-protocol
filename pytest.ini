[pytest]
testpaths = tests
python_files = test_*.py

# `slow` marks the EMD-family causality tests. They are correct but take
# minutes per case, so `python run.py check` deselects them and they are run
# explicitly before a full precompute:
#     python -m pytest tests/test_causality.py -v -m slow
markers =
    slow: long-running tests (EMD, EEMD, CEEMDAN)

addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
